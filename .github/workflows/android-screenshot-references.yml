name: Android Screenshot References

# Dispatch-only. Renders the Android screenshot-test reference PNGs (Layoutlib)
# on a clean runner and uploads them as an artifact for a person to commit.
#
# Why it exists: the committed references are the design-review set. For
# months the maintainer's Mac rendered them blank and this workflow was
# written as the "working environment" — then its first two runs found the
# real cause: the tests lived in a separate library module whose resource
# table never contained the app's resources, so the app's baked R IDs
# resolved nowhere (`Resources$NotFoundException: Could not resolve resource
# value: 0x7F10xxxx`, run 36600782034). The tests now live in the app module
# (`androidApp/src/screenshotTest/`) and render everywhere, this Mac
# included. This workflow stays as the clean-room cross-check: a runner with
# nothing cached, so a render that only works because of local state shows
# up. It never commits, never validates, and never runs on a PR: a person
# dispatches it, downloads the artifact into the reference directory, and
# runs `SKIP_RENDER=1 ./scripts/generate-android-screenshots.sh` for the
# gallery, collections, framing and store steps.
#
#   gh workflow run android-screenshot-references.yml
#   gh run download <run-id> -n android-screenshot-references \
#     -D MobileGarage/androidApp/src/screenshotTestDebug/reference
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render reference PNGs (Layoutlib)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-android
        with:
          encrypt-key: ${{ secrets.ENCRYPT_KEY }}

      # setup-android pins JDK 17 (the Android CI baseline, where the
      # screenshot tests are only COMPILED). The Preview Screenshot Test
      # Engine (com.android.compose.screenshot 0.0.1-alpha12) is built for
      # JDK 21 and fails its initialization on 17 with
      # UnsupportedClassVersionError (run 36599489071).
      - name: Use JDK 21 for the render (the engine's class version)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # One Gradle run per test class, exactly as scripts/generate-android-screenshots.sh
      # does locally (sequential to avoid Layoutlib OOM). Starts from an empty
      # reference dir so a deleted preview's PNG does not linger in the artifact.
      - name: Render every screenshot test class
        working-directory: MobileGarage
        run: |
          rm -rf androidApp/src/screenshotTestDebug/reference
          mkdir -p androidApp/src/screenshotTestDebug/reference
          for file in androidApp/src/screenshotTest/kotlin/com/chriscartland/garage/screenshottests/*.kt; do
            classname="com.chriscartland.garage.screenshottests.$(basename "$file" .kt)Kt"
            echo "::group::$classname"
            ./gradlew --no-configuration-cache :androidApp:updateDebugScreenshotTest \
              --tests "$classname" -PretainedReferenceScreenshots
            echo "::endgroup::"
          done

      # A blank render is THE failure mode, and it must fail here, not after
      # the PNGs are committed. The health script is warn-only by design (a
      # local aid), so the gate is its output, not its exit code.
      - name: Health check (a blank render fails the run)
        run: |
          ./scripts/check-screenshot-health.sh | tee health.txt
          if grep -q "Likely blank" health.txt; then
            echo "::error::Blank renders on the runner — the artifact must not be committed"
            exit 1
          fi

      - name: Summarize
        run: |
          COUNT=$(find MobileGarage/androidApp/src/screenshotTestDebug/reference -name '*.png' | wc -l | tr -d ' ')
          echo "Rendered $COUNT reference PNG(s) on $(uname -sr) / $(uname -m)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: android-screenshot-references
          path: MobileGarage/androidApp/src/screenshotTestDebug/reference
          if-no-files-found: error
          retention-days: 7

      - name: Clean secrets
        if: always()
        working-directory: MobileGarage
        run: ./release/clean-secrets.sh
