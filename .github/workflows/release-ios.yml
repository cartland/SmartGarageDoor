name: iOS Release

# Triggered by ios/N tags pushed by scripts/release-ios.sh.
# Archives the Release app and uploads it to TestFlight (Internal) — never the
# public App Store; promotion to App Store review is a manual App Store Connect step.
#
# N (from the tag) is the build number (CFBundleVersion / CURRENT_PROJECT_VERSION),
# overridden onto the archive here so the tag is the source of truth for it. The
# user-facing MARKETING_VERSION (X.Y.Z) comes from project.yml (committed).
#
# REQUIRED GitHub secrets (see docs/IOS_RELEASE_SETUP.md § "Automated releases"):
#   APP_STORE_CONNECT_KEY_ID      App Store Connect API Key ID
#   APP_STORE_CONNECT_ISSUER_ID   App Store Connect API Issuer ID
#   APP_STORE_CONNECT_KEY_P8      full contents of the AuthKey_<KEY_ID>.p8
#   GARAGE_SERVER_CONFIG_KEY      door-backend key (so the TestFlight build loads door data)
#   IOS_DIST_CERT_P12_BASE64      base64 of the Apple Distribution cert + private key (.p12)
#   IOS_DIST_CERT_PASSWORD        password that .p12 was exported with
#   IOS_PROVISIONING_PROFILE_BASE64  base64 of the App Store .mobileprovision
#
# SIGNING IS MANUAL, from stored assets — NOT cloud signing.
#
# It used to be automatic (`-allowProvisioningUpdates` + `-authenticationKey*`),
# which had xcodebuild mint an Apple Distribution certificate on demand. That
# works until the Apple account hits its certificate cap, and then every release
# fails at archive with "Your account has reached the maximum number of
# certificates" — which is what happened on ios/12 (2026-08-01). Certificates are
# a small, capped, account-wide resource; a CI job that creates one per release
# is spending a budget it cannot refill.
#
# So the cert and profile are now secrets, imported into a throwaway keychain
# that Clean secrets deletes. Regenerating them (including recovering from the
# cap) is documented in docs/IOS_RELEASE_SETUP.md § "Signing: stored cert".
#
# The App Store Connect API key is STILL required — the export step uses it to
# upload to TestFlight. Its Admin role is no longer needed for signing, but it
# is left as-is rather than downgraded (an unnecessary change to a credential
# that currently works). This is the ONLY place the deploy-capable credentials
# live; dev machines never hold them.

on:
  push:
    tags:
      - 'ios/[0-9]*'

permissions:
  contents: read
  issues: write

jobs:
  release:
    name: iOS Archive and Upload to TestFlight
    # Pinned to macos-26 (default Xcode 26.5). Apple rejects any upload not built
    # with the iOS 26 SDK (Xcode 26+) as of mid-2026; `macos-latest` still resolved
    # to Xcode 16.4 / iOS 18.5 SDK on 2026-07-01, and the ios/3 upload failed at
    # validation ("must be built with the iOS 26 SDK"). See docs/IOS_RELEASE_SETUP.md.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Validate tag format
        id: validate
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^ios/[0-9]+$ ]]; then
            echo "::error::Tag must match 'ios/N', got: $TAG"
            exit 1
          fi
          echo "build_number=${TAG#ios/}" >> "$GITHUB_OUTPUT"
          echo "Validated: tag=$TAG, buildNumber=${TAG#ios/}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the mainline check below can walk ancestry

      # Server-side re-assertion that this is a mainline commit. The release
      # script already refuses to tag anything off `main` locally, and a
      # Claude hook blocks pushing a tag ref directly -- but neither of those
      # is enforced here, on the runner, which is the one place this
      # workflow can't be argued with. This closes that gap independent of
      # who cut the tag or how the ref was pushed, and runs before the ASC
      # pre-flight below so a bad tag fails fast without touching secrets.
      - name: Verify tagged commit is on main
        run: |
          # Fetch into FETCH_HEAD rather than relying on refs/remotes/origin/main
          # existing -- actions/checkout's configured refspec for a tag-triggered
          # checkout is scoped to the tag, not a full branch mirror, so
          # origin/main may not exist locally even after this fetch.
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to commit $GITHUB_SHA, which is not reachable from origin/main. Refusing to release a commit that hasn't gone through the required main-branch checks."
            exit 1
          fi
          echo "Verified: $GITHUB_SHA is on origin/main."

      # This workflow is the ONLY credentialed path to a build — the deploy-capable
      # App Store Connect API key lives only here, never on a dev machine. So the
      # authoritative build-number check runs HERE, first, and fails fast (before the
      # slow JDK/Gradle/Xcode setup + archive). release-ios.sh only suggests a tag
      # from git tags; it cannot reach App Store Connect.
      - name: Write App Store Connect API key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc_keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/asc_keys/AuthKey_${KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Pre-flight — build number must be free on App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_BUNDLE_ID: com.chriscartland.garage
          N: ${{ steps.validate.outputs.build_number }}
        run: |
          echo "This release is tag ${GITHUB_REF#refs/tags/} (CFBundleVersion $N)."
          echo "Querying App Store Connect for the highest existing build number..."
          if ! LATEST=$(ruby scripts/asc-latest-build.rb); then
            echo "::error title=iOS release aborted::Could not query App Store Connect (ruby error above); stopped before archiving. Check the APP_STORE_CONNECT_* secrets (must be an Admin-role key)."
            exit 1
          fi
          echo "Highest existing build on App Store Connect: $LATEST"
          if [ "$N" -le "$LATEST" ]; then
            echo "Build $N is already used on App Store Connect (highest is $LATEST). Nothing was archived or uploaded."
            echo "To fix: release again with build number $((LATEST + 1)):"
            echo "    ./scripts/release-ios.sh --confirm-tag ios/$((LATEST + 1))"
            echo "You can delete this failed tag first:"
            echo "    git push origin :refs/tags/ios/$N && git tag -d ios/$N"
            echo "::error title=iOS release aborted — build number $N already used::Tag ios/$N -> CFBundleVersion $N, but App Store Connect already has build $LATEST for com.chriscartland.garage. Build numbers must STRICTLY INCREASE (else Apple silently renumbers the upload and the tag stops matching the build). Re-release as ios/$((LATEST + 1)). Nothing was archived or uploaded."
            exit 1
          fi
          echo "OK — build number $N is free (> $LATEST). Proceeding to setup + archive."

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ios-${{ hashFiles('MobileGarage/**/*.gradle*', 'MobileGarage/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ios-
            ${{ runner.os }}-gradle-

      - name: Install XcodeGen
        run: brew install xcodegen

      # Door-backend secret (mirrors the committed Secrets.xcconfig include); the
      # app builds without it but door data won't load. Removed in the Clean step.
      - name: Inject server config secret
        env:
          GARAGE_SERVER_CONFIG_KEY: ${{ secrets.GARAGE_SERVER_CONFIG_KEY }}
        run: |
          printf 'GARAGE_SERVER_CONFIG_KEY = %s\n' "$GARAGE_SERVER_CONFIG_KEY" \
            > MobileGarage/iosApp/Secrets.local.xcconfig

      - name: Generate Xcode project
        working-directory: MobileGarage/iosApp
        run: xcodegen generate

      # LAUNCH GATE — build the Release app for the simulator and prove it
      # launches (cold + warm) BEFORE anything is archived or uploaded. This is
      # the same Kotlin/Native release-mode framework compile + Swift -O as the
      # shipped artifact, built AFTER the server-config secret injection so the
      # smoke exercises the same config path as the TestFlight build. Added
      # after a TestFlight build (ios/7 era) shipped with a launch crash that
      # no existing step could have caught — nothing in CI ever launched the
      # app. Residual gaps (signed-in-only and device-only crashes) are
      # documented in docs/IOS_RELEASE_SETUP.md § Launch smoke gate.
      - name: Build Release app for simulator (launch gate)
        working-directory: MobileGarage/iosApp
        run: |
          xcodebuild \
            -project GarageControl.xcodeproj \
            -scheme GarageControl \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Launch smoke test (Release, simulator)
        run: ./scripts/ios-launch-smoke.sh --configuration Release --screenshot-dir "$RUNNER_TEMP/launch-smoke"

      # OLDEST-SUPPORTED-OS LEG — the ios/7 launch crash (HomeViewModelWrapper
      # `self!` trap) reproduced ONLY on iOS 16.x: newer SwiftUI defers the
      # Task timing that deallocates a discarded StateObject wrapper, so the
      # newest-runtime smoke above stayed green while the app crashed on every
      # launch on an iPhone X (capped at iOS 16 forever). This leg downloads
      # the deployment-target runtime (iOS 16.4, ~6 GB — a few minutes on
      # runner pipes) and re-runs the same smoke there. Blocking by design;
      # release-lane only (too slow for per-PR CI).
      - name: Launch smoke test (Release, iOS 16.4 deployment target)
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion 16.4 2>&1 | tail -2
          UDID=$(xcrun simctl create smoke-ios16 \
            com.apple.CoreSimulator.SimDeviceType.iPhone-14 \
            com.apple.CoreSimulator.SimRuntime.iOS-16-4)
          ./scripts/ios-launch-smoke.sh --configuration Release --udid "$UDID" \
            --screenshot-dir "$RUNNER_TEMP/launch-smoke-ios16"

      - name: Upload iOS 16.4 launch-smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-smoke-screenshots-ios16
          path: ${{ runner.temp }}/launch-smoke-ios16
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload launch-smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-smoke-screenshots
          path: ${{ runner.temp }}/launch-smoke
          if-no-files-found: ignore
          retention-days: 7

      # Signing assets come from secrets, NOT from cloud signing. See
      # docs/IOS_RELEASE_SETUP.md § "Signing: stored cert, not cloud signing"
      # for why, and for how to regenerate these three secrets.
      #
      # Fails loudly when a secret is missing rather than falling back to
      # `-allowProvisioningUpdates`: a silent fallback would put us straight
      # back on the path that exhausted the certificate quota, and it would do
      # so invisibly, mid-release.
      - name: Install signing certificate and provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CERT_P12_BASE64:-}" ] || missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -n "${CERT_PASSWORD:-}" ] || missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -n "${PROFILE_BASE64:-}" ] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error title=iOS signing secrets missing::Required secret(s):$missing. See docs/IOS_RELEASE_SETUP.md § Signing."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Random per-run password; the keychain is deleted in Clean secrets.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock: a long archive must not hit a locked keychain midway.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Prepend to the search list rather than replacing it, so the system
          # roots needed to validate the cert chain stay reachable.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          # Without this, codesign triggers a UI authorization prompt that can
          # never be answered on a headless runner and the build hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          # Xcode has moved this directory across versions; install to both so
          # the workflow does not depend on which one this Xcode reads.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done

          echo "Imported profile '$PROFILE_NAME' ($PROFILE_UUID)"
          echo "Signing identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # The pre-build Run Script builds shared.framework for device arm64 via Gradle.
      - name: Archive (Release)
        working-directory: MobileGarage/iosApp
        # No -authenticationKey* here any more: with manual signing the archive
        # never contacts App Store Connect. The API key is still needed by the
        # export step below, which uploads.
        run: |
          xcodebuild -version   # log the Xcode/SDK: must be iOS 26 SDK for upload
          xcodebuild \
            -project GarageControl.xcodeproj \
            -scheme GarageControl \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GarageControl.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ steps.validate.outputs.build_number }} \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=4EFTFGDT4G \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>4EFTFGDT4G</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.chriscartland.garage</key><string>PROFILE_NAME_PLACEHOLDER</string>
            </dict>
          </dict>
          </plist>
          PLIST
          # Substituted after the heredoc so the profile name stays a runtime
          # value (the heredoc is quoted, which is what keeps the XML literal).
          python3 - "$RUNNER_TEMP/ExportOptions.plist" "$PROFILE_NAME" <<'PY'
          import sys
          path, name = sys.argv[1], sys.argv[2]
          with open(path) as f:
              body = f.read()
          assert "PROFILE_NAME_PLACEHOLDER" in body, "placeholder missing"
          with open(path, "w") as f:
              f.write(body.replace("PROFILE_NAME_PLACEHOLDER", name))
          PY
          cat "$RUNNER_TEMP/ExportOptions.plist"

      # destination=upload sends the signed build straight to App Store Connect /
      # TestFlight using the API key — no altool/Transporter step needed.
      - name: Export + upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GarageControl.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$ASC_KEY_PATH"

      - name: Clean secrets
        if: always()
        run: |
          rm -f MobileGarage/iosApp/Secrets.local.xcconfig
          rm -rf "$RUNNER_TEMP/asc_keys"
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" \
                "$RUNNER_TEMP/profile.plist"
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

      - name: Release summary
        run: |
          echo "::notice title=iOS Release::Uploaded ${{ github.ref_name }} (build ${{ steps.validate.outputs.build_number }}) to TestFlight Internal (com.chriscartland.garage)"

  # Track release failures via one GitHub issue (auto-create on failure,
  # auto-close on the next successful release). Mirrors release-android.yml.
  track-failure:
    name: Track iOS Release Failure
    if: always()
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-failure-tracker
        with:
          label: release-failure/ios
          result: ${{ needs.release.result == 'success' && 'success' || 'failure' }}
          workflow-name: "iOS Release (tag: ${{ github.ref_name }})"
